<style>

#hud{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;gap:8px;padding:12px 14px;font-size:clamp(15px,4.2vw,22px)}
#hud .hr{display:contents}#hud span{white-space:nowrap}#hud>span:first-child{min-width:128px}
#hud .hr>span:not(#sh):not(#jbw):not(#mgw){min-width:92px}#hud b{font-variant-numeric:tabular-nums}
#jbw,#mgw,#sh{position:fixed;right:14px}
#jbw{top:calc(max(0px,env(safe-area-inset-top,0px)) + 66px)}#mgw{top:calc(max(0px,env(safe-area-inset-top,0px)) + 108px)}#sh{top:calc(max(0px,env(safe-area-inset-top,0px)) + 150px)}
@keyframes bump{50%{filter:brightness(2);text-shadow:0 0 8px #fff}}
#nmx{position:fixed;left:0;right:0;top:34%;text-align:center;font:800 clamp(16px,4.5vw,22px) Poppins,sans-serif;color:#ffe9b0;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none}
#packs{gap:8px;width:100%;max-width:420px}
.pk{flex:1;min-width:0;background:linear-gradient(170deg,rgba(74,42,88,.92),rgba(30,16,40,.95));border:2px solid rgba(255,207,74,.35);border-radius:14px;color:#fff3c4;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px Poppins,sans-serif;cursor:pointer}
.pk .pkI{font-style:normal;font-size:22px}.pk span{color:var(--gold);font-weight:800}.pk.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(255,207,74,.5);transform:translateY(-3px)}
.pa{width:130px;height:130px;border-radius:50%;margin:6px auto 14px;border:4px solid var(--rc,#ffcf4a);box-shadow:0 0 40px var(--rc,#ffcf4a);display:grid;place-items:center;font-size:56px}
.pa.shake{animation:shk .25s infinite}.pa.pop{animation:popin .6s cubic-bezier(.2,1.4,.3,1)}@keyframes shk{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@keyframes popin{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.card.cx{width:min(380px,100%)}.cxh{font-weight:900;text-align:left;margin:12px 0 6px;letter-spacing:.04em}.cxg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cc{border:1.5px solid var(--rc);border-radius:12px;padding:6px 2px;text-align:center;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:3px}
.cc i{width:34px;height:34px;border-radius:50%;display:block;border:2px solid #fff3d0}.cc small{font-size:10px;opacity:.7}.cc b{font-size:10px;line-height:1.1}.cc.lk i{background:#2a2a35!important;filter:grayscale(1)}.cc.lk{opacity:.6}
#msg:empty{display:none}
#packs{flex-direction:column;gap:6px;max-width:440px}
.phd{display:flex;justify-content:space-between;align-items:center;font:800 13px Poppins,sans-serif;color:#ffe9b0;letter-spacing:.06em;text-transform:uppercase}
.idxb{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,207,74,.5);border-radius:999px;color:#ffe9b0;padding:6px 12px;font:800 12px Poppins,sans-serif;cursor:pointer;text-transform:none}
.pcar{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none}.pcar::-webkit-scrollbar{display:none}
.pkc{flex:0 0 138px;scroll-snap-align:center;position:relative;overflow:hidden;border-radius:20px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(160deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.pkc::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shn2 4s ease-in-out infinite;pointer-events:none}
.pkart{font-size:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));animation:flo 3s ease-in-out infinite}
.pkc b{font:900 14px Cinzel,Georgia,serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
